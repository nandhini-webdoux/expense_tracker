
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>💰 Expense Tracker</h1>
    <p>Track your money. Manage your spending.</p>
  </header>

  <main class="container">
    <section class="budget-section">
      <label for="budget">Monthly Budget (₹)</label>
      <input type="number" id="budget" min="0" step="0.01"
             placeholder="Enter your monthly budget">
      <button id="saveBudget">Save Budget</button>
    </section>

    <section class="summary">
      <article class="summary-card">
        <h3>Total Expenses</h3>
        <p id="totalExpenses">₹0.00</p>
      </article>
      <article class="summary-card">
        <h3>Monthly Budget</h3>
        <p id="totalBudget">₹0.00</p>
      </article>
      <article class="summary-card">
        <h3>Remaining Balance</h3>
        <p id="balance">₹0.00</p>
      </article>
    </section>

    <section class="form-section">
      <h2 id="formTitle">Add Expense</h2>

      <form id="expenseForm">
        <label for="title">Expense Name</label>
        <input type="text" id="title" required
               placeholder="e.g. Groceries">

        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" min="0.01" step="0.01"
               required placeholder="Enter amount">

        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <label for="date">Expense Date</label>
        <input type="date" id="date" required>

        <div class="form-actions">
          <button type="submit" id="submitButton">Add Expense</button>
          <button type="button" id="cancelEdit" hidden>
            Cancel Edit
          </button>
        </div>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="filter-section">
      <h2>Expense History</h2>

      <div class="filters">
        <div>
          <label for="monthFilter">Filter by Month</label>
          <input type="month" id="monthFilter">
        </div>

        <div>
          <label for="categoryFilter">Filter by Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="button" id="clearFilters">Clear Filters</button>
      </div>

      <div id="expenseList" class="expense-list"></div>
      <p id="emptyMessage">No expenses found.</p>
    </section>
  </main>

  <footer>
    <p>Expense Tracker | Built with HTML, CSS and JavaScript</p>
  </footer>
</body>
</html>
